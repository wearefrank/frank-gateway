routes:
  - name: traffic-split-service
    uri: /soap/myservice
    plugins:
          proxy-rewrite:
               uri: /anything
          soap-action-router:
               routes:
                  - soapAction: testTwo
                    upstream_id: testTwo
                  - soapAction: testOne
                    upstream_id: testOne
upstreams:
  - name: httpbun
    scheme: http
    pass_host: node
    id: testOne
    nodes:
      "httpbun:80": 1
    type: roundrobin
  - name: httpbun
    scheme: http
    id: testTwo
    nodes:
      "httpbun:80": 1
    type: roundrobin

#END
