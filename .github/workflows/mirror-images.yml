name: Mirror Open FTV PDP

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/mirror-images.yml"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Install Skopeo
        run: sudo apt-get update && sudo apt-get install --yes skopeo

      - name: Copy image to GHCR
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GHCR_USER" --password-stdin
          skopeo copy --all \
            docker://registry.gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/pdp:v0.1.0 \
            docker://ghcr.io/wearefrank/mirror-open-ftv-pdp:v0.1.0
