name: Release

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3). Required for manual runs."
        required: false

concurrency:
  group: ghcr-release
  cancel-in-progress: false


jobs:
  analyze-commits:
    runs-on: ubuntu-latest
    outputs:
      version-next: ${{ steps.next-version.outputs.release-version }}
      version-next-tag: ${{ steps.next-version.outputs.release-tag }}
      version-next-type: ${{ steps.next-version.outputs.release-type }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
      
      - name: "Setup Node"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #7.0.0
        with:
          node-version: 24
      
      - name: Install dependencies
        run: yarn global add semantic-release @semantic-release/changelog @semantic-release/github @semantic-release/exec @semantic-release/release-notes-generator @semantic-release/commit-analyzer conventional-changelog-conventionalcommits@8.0.0
      
      - name: Get next version
        id: next-version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "release-version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "release-tag=v$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "release-type=manual" >> $GITHUB_OUTPUT
          else
            semantic-release --dryRun
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}


  ci:
    needs: analyze-commits
    if: needs.analyze-commits.outputs.version-next-type != '' || inputs.version != ''
    uses: ./.github/workflows/ci.yml

  docker-ci:
    uses: wearefrank/ci-cd-templates/.github/workflows/docker-ci-generic.yml@3ea6c89c3ffb6c75528377110fea41851bc87c01 #2.4.11
    needs:
      - analyze-commits
      - ci
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      image-name: ${{ github.event.repository.name }}-staging
      version: ${{ inputs.version || needs.analyze-commits.outputs.version-next }}
      upload-sarif-to-security: false
      run-frank-till-healthy-enabled: false

  release:
    runs-on: ubuntu-latest
    needs:
      - analyze-commits
      - ci
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #7.0.0

      - name: Download Pre-build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #8.0.1
        with:
          pattern: pre-build-*
          merge-multiple: true
  
      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #8.0.1
        with:
          pattern: build-*
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #6.4.0
        with:
          node-version: lts/*
      
      - name: Install dependencies
        run: corepack yarn --cwd .github/semantic-release install --frozen-lockfile
      
      - name: Semantic Release
        run: ./.github/semantic-release/node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.WEAREFRANK_BOT_PAT }}
          GH_TOKEN: ${{ secrets.WEAREFRANK_BOT_PAT }}

  docker-release:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: wearefrank/ci-cd-templates/.github/workflows/docker-release-generic.yml@3ea6c89c3ffb6c75528377110fea41851bc87c01 #2.4.11
    needs: 
      - analyze-commits
      - release
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      version: ${{ inputs.version ||needs.analyze-commits.outputs.version-next }}