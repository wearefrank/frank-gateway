# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build(dependencies):"
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "build(dependencies):"
    groups:
      apisix-base-image:
        patterns: [ "*" ]
    allow:
      - dependency-name: "apache/apisix"

  - package-ecosystem: "docker"
    directories: [ "/mirrors/*" ]
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build(dependencies):"

  - package-ecosystem: "docker"
    directory: "/tests/auth-zen"
    schedule:
      interval: "weekly"
      day: "monday"
    allow:
      - dependency-name: "ghcr.io/wearefrank/mirror-open-ftv-pdp"
    commit-message:
      prefix: "build(dependencies):"
